services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://lol:lol_dev_password@database:5432/lol_tournaments?serverVersion=17&charset=utf8"
    command: php -S 0.0.0.0:8000 -t public
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

  database:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: lol_tournaments
      POSTGRES_USER: lol
      POSTGRES_PASSWORD: lol_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lol -d lol_tournaments"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  frontend_node_modules:
