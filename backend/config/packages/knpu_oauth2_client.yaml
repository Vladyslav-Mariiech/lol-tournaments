knpu_oauth2_client:
    clients:
        discord:
            type: discord
            client_id: '%env(DISCORD_CLIENT_ID)%'
            client_secret: '%env(DISCORD_CLIENT_SECRET)%'
            # Название роута Symfony, на который Discord перенаправит пользователя с кодом авторизации
            redirect_route: connect_discord_check
            redirect_params: { }
